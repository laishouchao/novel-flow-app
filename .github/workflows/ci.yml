name: CI Build Check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      # Linux 依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # macOS 依赖
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install create-dmg

      # 生成默认图标（如果不存在）
      - name: Setup icons
        run: |
          mkdir -p src-tauri/icons
          if [ ! -f src-tauri/icons/icon.png ]; then
            # 创建一个简单的 PNG 图标（32x32）
            node -e "
              const fs = require('fs');
              // 创建一个简单的 32x32 PNG 图片（纯色蓝色方块）
              const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAWElEQVR42mP4//8/AwMDAwMjIyMDAwMDAyMDAwMTAwMDAwMQhv4/////8zMDAwMjIyMDAwMDAwMTEyMjAyMjAyMjIyMzEyMDAyMjAxMf4HAAoEAgH5xX8YAAAAAElFTkSuQmCC', 'base64');
              fs.writeFileSync('src-tauri/icons/icon.png', png);
            "
          fi
          # 复制为其他尺寸
          cp src-tauri/icons/icon.png src-tauri/icons/32x32.png 2>/dev/null || true
          cp src-tauri/icons/icon.png src-tauri/icons/128x128.png 2>/dev/null || true
          cp src-tauri/icons/icon.png src-tauri/icons/128x128@2x.png 2>/dev/null || true

      # 使用 tauri-cli 构建
      - name: Build Tauri app
        uses: tauri-apps/tauri-cli@v0
        with:
          args: build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novel-flow-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            src-tauri/target/${{ matrix.target }}/release/*.exe
          if-no-files-found: ignore

      # Windows: 查找 exe 文件
      - name: Find Windows exe
        if: matrix.platform == 'windows-latest'
        run: |
          ls -la src-tauri/target/x86_64-pc-windows-msvc/release/*.exe 2>/dev/null || echo "No exe found"

      # macOS: 查找 dmg 文件
      - name: Find macOS dmg
        if: matrix.platform == 'macos-latest'
        run: |
          ls -la src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null || echo "No dmg found"
