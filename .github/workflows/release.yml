name: Release NovelFlow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            artifact: NovelFlow-windows-x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            ext: .dmg
            artifact: NovelFlow-macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            ext: .dmg
            artifact: NovelFlow-macos-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: .deb
            artifact: NovelFlow-linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Linux 依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # macOS 依赖
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install create-dmg

      # Windows 依赖 (MSVC 自带)

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NovelFlow ${{ github.ref_name }}'
          releaseBody: |
            ## NovelFlow - AI辅助长篇小说写作客户端

            ### 下载
            - **Windows**: `NovelFlow_*.x64-setup.nsis.zip` 或 `NovelFlow_*.x64-setup.exe`
            - **macOS (Intel)**: `NovelFlow_*_x64.dmg`
            - **macOS (Apple Silicon)**: `NovelFlow_*_aarch64.dmg`
            - **Linux**: `NovelFlow_*.amd64.deb`

            ### 功能特性
            - 🧠 灵感收束：9维度渐进对话 + 雪花写作法
            - 📋 章节规划：结构标记 + 悬念密度/伏笔/认知颠覆
            - ✍️ AI写作：Scene/Sequel交替 + 去AI味系统（210+禁用词）
            - 🔍 四层审查：读者视角→禁用词→Canon→升级感
            - 🎨 风格引擎：冷白描/系统爽文/怪诞悬疑 + 自定义
            - 🤖 多模型支持：OpenAI/DeepSeek/Ollama 等兼容API
            - ⚙️ 分任务指派：不同步骤使用不同AI模型

            **完整更新日志请查看 [CHANGELOG.md](https://github.com/laishouchao/novel-flow-app/blob/main/CHANGELOG.md)**
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
