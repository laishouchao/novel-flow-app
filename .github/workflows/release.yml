name: Release NovelFlow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Linux 依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            create-dmg

      # macOS 依赖
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install create-dmg

      # 生成默认图标
      - name: Setup icons
        run: |
          mkdir -p src-tauri/icons
          node -e "
            const fs = require('fs');
            // 创建一个简单的 32x32 PNG 图片
            const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAWElEQVR42mP4//8/AwMDAwMjIyMDAwMDAyMDAwMTAwMDAwMQhv4/////8zMDAwMjIyMDAwMDAwMTEyMjAyMjAyMjIyMzEyMDAyMjAxMf4HAAoEAgH5xX8YAAAAAElFTkSuQmCC', 'base64');
            fs.writeFileSync('src-tauri/icons/icon.png', png);
            fs.writeFileSync('src-tauri/icons/32x32.png', png);
            fs.writeFileSync('src-tauri/icons/128x128.png', png);
            fs.writeFileSync('src-tauri/icons/128x128@2x.png', png);
          "

      # 使用 tauri-cli 构建
      - name: Build Tauri app
        uses: tauri-apps/tauri-cli@v0
        with:
          args: build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novel-flow-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            src-tauri/target/${{ matrix.target }}/release/*.exe
            src-tauri/target/${{ matrix.target }}/release/*.msi
          if-no-files-found: ignore

  # 创建 GitHub Release
  create-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'NovelFlow ${{ github.ref_name }}'
          body: |
            ## NovelFlow - AI辅助长篇小说写作客户端

            ### 下载
            请下载对应平台的安装包：
            - **Windows**: `NovelFlow_*.x64-setup.nsis.zip` 或 `.msi`
            - **macOS (Intel)**: `NovelFlow_*_x64.dmg`
            - **macOS (Apple Silicon)**: `NovelFlow_*_aarch64.dmg`
            - **Linux**: `NovelFlow_*.amd64.deb`

            ### 功能特性
            - 🧠 灵感收束：9维度渐进对话 + 雪花写作法
            - 📋 章节规划：结构标记 + 悬念密度/伏笔/认知颠覆
            - ✍️ AI写作：Scene/Sequel交替 + 去AI味系统（210+禁用词）
            - 🔍 四层审查：读者视角→禁用词→Canon→升级感
            - 🎨 风格引擎：冷白描/系统爽文/怪诞悬疑 + 自定义
            - 🤖 多模型支持：OpenAI/DeepSeek/Ollama 等兼容API
            - ⚙️ 分任务指派：不同步骤使用不同AI模型

          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/bundle/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
