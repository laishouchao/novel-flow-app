[package]
name = "novel-flow"
version = "0.1.0"
description = "NovelFlow - AI 写作工作台"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "dialog-all",
  "fs-all",
  "shell-open",
  "path-all",
  "protocol-asset",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
